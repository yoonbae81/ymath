name: Diagnose oMLX over WireGuard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ vars.HOST }}
      USER: ${{ vars.USER }}
      KNOWN_HOSTS: ${{ vars.KNOWN_HOSTS }}

    steps:
      - name: Connect WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y wireguard-tools >/dev/null
          umask 077
          printf '%s\n' "$WG_CONFIG" | tr -d '\r' | grep -viE '^\s*DNS\s*=' > "$RUNNER_TEMP/wg.conf"
          ! grep -qE 'AllowedIPs.*(0\.0\.0\.0/0|::/0)' "$RUNNER_TEMP/wg.conf"
          sudo wg-quick up "$RUNNER_TEMP/wg.conf"

      - name: Inspect and correct oMLX provider
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh_key"
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
            check=yes
          else
            check=accept-new
          fi

          ssh -i "$RUNNER_TEMP/ssh_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o "StrictHostKeyChecking=$check" \
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/ymath
          printf 'DEPLOY_HEAD=%s\n' "$(git rev-parse --short HEAD)"
          printf 'DEPLOY_BRANCH=%s\n' "$(git branch --show-current)"
          printf 'DEPLOY_STATUS_BEGIN\n'
          git status --short
          printf 'DEPLOY_STATUS_END\n'
          printf 'DEPLOY_DIFF_SHA256=%s\n' "$(git diff --binary | sha256sum | cut -d' ' -f1)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          printf 'SERVICE_ACTIVE=%s\n' "$(systemctl --user is-active ymath.service || true)"

          python3 - <<'PY'
          import json
          import os
          import stat
          import urllib.error
          import urllib.request
          from pathlib import Path

          path = Path('/opt/ymath/user/config/providers.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          providers = document.get('providers')
          if not isinstance(providers, dict) or not isinstance(providers.get('omlx'), dict):
              raise SystemExit('providers.json: providers.omlx is missing')
          omlx = providers['omlx']
          before = omlx.get('baseUrl')
          models = omlx.get('models') if isinstance(omlx.get('models'), list) else []
          configured_models = [entry.get('id') for entry in models if isinstance(entry, dict) and isinstance(entry.get('id'), str)]
          api_key = omlx.get('apiKey')
          if not isinstance(api_key, str) or not api_key:
              raise SystemExit('providers.json: providers.omlx.apiKey is missing')

          print(f'CONFIG_BEFORE_BASE_URL={before}')
          print(f'CONFIG_MODELS={json.dumps(configured_models, ensure_ascii=False)}')
          print('CONFIG_API_KEY_PRESENT=true')

          required = {'PaddleOCR-VL-1.6-mlx', 'Qwen3.6-35B-A3B'}
          candidates = [
              ('standard_https', 'https://llm.xcv.kr/v1'),
              ('requested', 'https://llm.xcv.kr:9000'),
          ]
          selected = None
          available = []
          for label, base_url in candidates:
              endpoint = base_url.rstrip('/') + '/models'
              request = urllib.request.Request(
                  endpoint,
                  headers={
                      'Authorization': f'Bearer {api_key}',
                      'Accept': 'application/json',
                      'User-Agent': 'curl/8.7.1',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      status = response.status
                      payload = json.load(response)
                  ids = [entry.get('id') for entry in payload.get('data', []) if isinstance(entry, dict) and isinstance(entry.get('id'), str)]
                  print(f'PROBE_{label.upper()}_URL={endpoint}', flush=True)
                  print(f'PROBE_{label.upper()}_HTTP_STATUS={status}', flush=True)
                  print(f'PROBE_{label.upper()}_MODELS={json.dumps(ids, ensure_ascii=False)}', flush=True)
                  if status == 200 and required.issubset(ids):
                      selected = base_url
                      available = ids
                      break
              except urllib.error.HTTPError as error:
                  print(f'PROBE_{label.upper()}_URL={endpoint}', flush=True)
                  print(f'PROBE_{label.upper()}_HTTP_STATUS={error.code}', flush=True)
              except Exception as error:
                  print(f'PROBE_{label.upper()}_URL={endpoint}', flush=True)
                  print(f'PROBE_{label.upper()}_ERROR={type(error).__name__}: {error}', flush=True)

          if selected is None:
              raise SystemExit('No reachable oMLX endpoint exposes both required models')

          changed = before != selected
          if changed:
              omlx['baseUrl'] = selected
              temporary = path.with_name(path.name + '.tmp-omlx-endpoint')
              temporary.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              os.chmod(temporary, stat.S_IMODE(path.stat().st_mode))
              os.replace(temporary, path)
          print(f'CONFIG_CHANGED={str(changed).lower()}')
          print(f'CONFIG_AFTER_BASE_URL={omlx.get("baseUrl")}')
          print(f'MODELS_AVAILABLE={json.dumps(available, ensure_ascii=False)}')
          print(f'OCR_MODEL_PRESENT={str("PaddleOCR-VL-1.6-mlx" in available).lower()}')
          PY
          REMOTE

      - name: Disconnect and clean up
        if: always()
        run: |
          sudo wg-quick down "$RUNNER_TEMP/wg.conf" || true
          rm -f "$RUNNER_TEMP"/{wg.conf,ssh_key,known_hosts}
