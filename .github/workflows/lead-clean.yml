# 임시 운영 정비 워크플로 - 배포 호스트 작업트리 정리 + oMLX 엔드포인트 도달성 확인 (stash 만, 읽기 외 변경 없음)
# 끝나면 이 브랜치와 파일은 삭제한다.
name: Lead ops - deploy host clean
on:
  push:
    branches: [ops/lead-clean]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lead-ops
  cancel-in-progress: false
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          umask 077
          printf '%s\n' "$WG_CONFIG" | tr -d '\r' | grep -viE '^\s*DNS\s*=' > "$RUNNER_TEMP/wg.conf"
          ! grep -qE 'AllowedIPs.*(0\.0\.0\.0/0|::/0)' "$RUNNER_TEMP/wg.conf"
          sudo wg-quick up "$RUNNER_TEMP/wg.conf"
      - name: Clean tree and verify oMLX endpoint
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh_key"
          {
            cat <<'REMOTE'
          set -euo pipefail
          cd /opt/ymath
          echo "== BEFORE =="
          git status --short --branch | head -6
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git stash push -m "lead-clean-$(date +%Y%m%d%H%M%S)"
            echo "== STASHED =="
          else
            echo "== TREE ALREADY CLEAN =="
          fi
          echo "== providers.json omlx.baseUrl 교정 =="
          node -e '
          const fs = require("fs");
          const p = "/opt/ymath/user/config/providers.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          if (!j.providers || !j.providers.omlx) { console.error("omlx 항목 없음"); process.exit(1); }
          console.log("이전 baseUrl:", j.providers.omlx.baseUrl || "(없음)");
          j.providers.omlx.baseUrl = "https://llm.xcv.kr/v1";
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          console.log("새 baseUrl:", j.providers.omlx.baseUrl);
          '
          KEY=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/opt/ymath/user/config/providers.json","utf8")).providers.omlx.apiKey)')
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 -H "Authorization: Bearer $KEY" https://llm.xcv.kr/v1/models || echo "rc=$?")
          echo "인증 포함 /v1/models -> HTTP $code"
          git log -1 --format='%h %s'
          echo "== 포트 리스닝 확인 =="
          (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | grep -E "3141" | head -5 || echo "3141 리스닝 없음"
          echo "== 서비스 유닛 =="
          systemctl --user cat ymath.service 2>/dev/null | grep -iE "Environment|ExecStart" | head -6 || true
          echo "== 4건 현재 상태 =="
          for id in 20261004-110150-csx1 20261004-110115-a42f 20261004-110107-gk8w 20261004-110054-x9tz; do
            node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const m=j.meta?j.meta.provider+"/"+j.meta.model+" @"+j.meta.analyzed_at:"(meta 없음)"; console.log(process.argv[1].split("/").pop(), "|", j.status, "|", m, "|", (j.error||"").slice(0,90));' /opt/ymath/user/data/items/$id/record.json 2>/dev/null || echo "$id record.json 없음"
          done
          REMOTE
          } | ssh -i "$RUNNER_TEMP/ssh_key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 y@10.0.0.2 'bash -s'
