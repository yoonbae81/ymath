# 임시 운영 정비 워크플로 — 배포 호스트 작업트리 정리 + oMLX 엔드포인트 도달성 확인 (읽기·stash 만)
# 끝나면 이 브랜치와 파일은 삭제한다.
name: Lead ops - deploy host clean
on:
  push:
    branches: [ops/lead-clean]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lead-ops
  cancel-in-progress: false
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          umask 077
          printf '%s\n' "$WG_CONFIG" | tr -d '\r' | grep -viE '^\s*DNS\s*=' > "$RUNNER_TEMP/wg.conf"
          ! grep -qE 'AllowedIPs.*(0\.0\.0\.0/0|::/0)' "$RUNNER_TEMP/wg.conf"
          sudo wg-quick up "$RUNNER_TEMP/wg.conf"
      - name: Clean tree and verify oMLX endpoint
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh_key"
          {
            echo "== BEFORE =="
            cd /opt/ymath && git status --short --branch | head -12
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push -m "lead-clean-$(date +%Y%m%d%H%M%S)"
              echo "== STASHED =="
            else
              echo "== TREE ALREADY CLEAN =="
            fi
            echo "== AFTER =="
            git status --short | head -12
            git log -1 --format='%h %s'
            echo "== oMLX endpoint from deploy host =="
            curl -sS -o /dev/null -w "https://llm.xcv.kr:9000/v1/models -> HTTP %{http_code} (%{time_total}s)\n" --max-time 15 https://llm.xcv.kr:9000/v1/models || echo "curl failed rc=$?"
          } | ssh -i "$RUNNER_TEMP/ssh_key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 y@10.0.0.2 'bash -s'
