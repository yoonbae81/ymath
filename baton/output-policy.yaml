# ymath App 결과 정책 (App 소유 — Runner가 임의로 바꾸지 않는다)
# R2 버킷 math 는 S3 호환 provider 이다(target s3, 별도 target 이름이 아니다).
# 실제 접속·credential은 Runner storage catalog(config/ymath.cloud.json 의 env 참조 + secrets.env)가 해석한다.
artifacts:
  request:
    target: s3
    storage_profile: ymath-r2
    prefix: items/
    key_template: "items/{entity_id}/baton-request-{job_id}-{generation}.json"
    content_type: application/json
    retention: consume-until-finalize   # ymath가 최종 커밋 뒤 정리한다
  final:
    target: s3
    storage_profile: ymath-r2
    prefix: items/
    key_template: "items/{entity_id}/baton-result-{job_id}-{generation}.json"
    content_type: application/json
    # 키 계약: 기존 R2 결과 키와 같은 items/<entity_id>/ 접두어 안이다. 최종 분석
    # 이미지·JSON의 커밋 키(analysis-*.jpg.json)는 ymath commitCloudResult 가 기존
    # 계약대로 생성하며, 이 final artifact는 Runner가 쓰는 검증된 staging 산출물이다.
    hash: sha256
    readback_verify: true
publish:
  reference_updates: []   # 암묵적 webhook 없음 — ymath가 D1/R2 최종화를 소유한다
